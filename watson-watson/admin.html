<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Content Editor — Watson &amp; Watson Associates</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0f2743;--navy-2:#1c3f66;--navy-deep:#081627;
    --gold:#c29a4a;--gold-bright:#e2c078;
    --paper:#faf8f4;--card:#fff;--ink:#23262c;--muted:#68707c;--hairline:#e8e3d8;
    --r:14px;--shadow:0 2px 6px rgba(8,22,39,.05),0 18px 46px rgba(8,22,39,.09);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1080px;margin:0 auto;padding:0 24px}
  .topbar{background:var(--navy-deep);color:#c8d3e2;padding:.9rem 0}
  .topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:1rem}
  .topbar b{font-family:'Cormorant Garamond',serif;font-size:1.3rem;color:#fff}
  .topbar .chip{font-size:.66rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;background:var(--gold);color:#2f2410;padding:.3rem .7rem;border-radius:999px}
  .topbar a{font-size:.82rem;font-weight:600}
  .topbar a:hover{color:var(--gold-bright)}
  .btn{display:inline-flex;align-items:center;gap:.45rem;padding:.62rem 1.3rem;border-radius:999px;font-weight:700;font-size:.85rem;cursor:pointer;border:none;transition:.2s;font-family:inherit}
  .btn-navy{background:var(--navy);color:#fff}
  .btn-navy:hover{background:var(--navy-2)}
  .btn-gold{background:linear-gradient(135deg,var(--gold-bright),var(--gold));color:#2f2410}
  .btn-ghost{background:#fff;border:1.5px solid var(--hairline)}
  .btn-ghost:hover{border-color:var(--navy);color:var(--navy)}
  .btn-danger{background:#fff;border:1.5px solid #e3c4c4;color:#9c2c2c}
  .btn-danger:hover{background:#9c2c2c;border-color:#9c2c2c;color:#fff}
  .btn-sm{padding:.4rem .95rem;font-size:.78rem}
  main{padding:2.2rem 0 4rem}
  h1{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:2rem;color:var(--navy)}
  .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.2rem;flex-wrap:wrap;gap:1rem}
  .note{background:#f3f0e6;border:1px solid #ddd3b8;border-radius:10px;padding:.7rem 1rem;font-size:.8rem;color:#6b5d33;margin-bottom:1.4rem}
  .tabs{display:flex;gap:.5rem;margin-bottom:1.6rem}
  .tabs button{padding:.6rem 1.4rem;border-radius:999px;border:1.5px solid var(--hairline);background:#fff;font:inherit;font-weight:700;font-size:.86rem;cursor:pointer;color:var(--muted)}
  .tabs button.on{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 6px 16px rgba(15,39,67,.3)}
  .card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:.9rem}
  th{font-size:.68rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:left;padding:1rem 1.2rem;border-bottom:2px solid var(--hairline)}
  td{padding:.9rem 1.2rem;border-bottom:1px solid var(--hairline);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:#f7f4ec}
  .thumb{width:52px;height:52px;border-radius:50%;object-fit:cover;object-position:center top;background:#eee;display:block}
  .t-main{font-weight:600;max-width:380px}
  .t-main small{display:block;font-weight:500;color:var(--muted);font-size:.76rem}
  .actions{display:flex;gap:.4rem;justify-content:flex-end}
  /* form */
  .editor{display:none}
  .editor.open{display:block}
  .list-view.closed{display:none}
  form .grid{display:grid;grid-template-columns:1fr 1fr;gap:1.1rem;padding:1.8rem}
  form .full{grid-column:1/-1}
  label{display:block;font-size:.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--navy);margin-bottom:.35rem}
  input[type=text],textarea{width:100%;padding:.75rem .9rem;border:1.5px solid var(--hairline);border-radius:10px;font:inherit;font-size:.9rem;background:var(--paper)}
  input:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(194,154,74,.16);background:#fff}
  textarea{min-height:110px;resize:vertical}
  .imgdrop{border:2px dashed var(--hairline);border-radius:12px;padding:1rem;text-align:center;font-size:.82rem;color:var(--muted);cursor:pointer;transition:.2s;background:#fff}
  .imgdrop:hover{border-color:var(--gold);color:var(--navy)}
  .imgdrop img{max-height:150px;border-radius:8px;margin:0 auto .5rem}
  .form-foot{display:flex;justify-content:space-between;padding:1.2rem 1.8rem;border-top:1px solid var(--hairline);background:#fcfaf6}
  /* login */
  #gate{position:fixed;inset:0;background:var(--navy-deep);display:flex;align-items:center;justify-content:center;z-index:99}
  #gate .box{background:#fff;border-radius:16px;padding:2.4rem;width:min(380px,90vw);text-align:center}
  #gate h2{font-family:'Cormorant Garamond',serif;font-weight:700;color:var(--navy);margin:.6rem 0 .2rem;font-size:1.5rem}
  #gate p{font-size:.82rem;color:var(--muted);margin-bottom:1.2rem}
  #gate input{text-align:center;margin-bottom:.8rem}
  #gate .err{color:#9c2c2c;font-size:.78rem;min-height:1.1rem;margin-top:.4rem}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--navy-deep);color:#fff;padding:.8rem 1.5rem;border-radius:999px;font-size:.85rem;font-weight:600;transition:.3s;opacity:0}
  .toast.show{transform:translateX(-50%);opacity:1}
  @media(max-width:720px){form .grid{grid-template-columns:1fr}.t-hide{display:none}}
  /* Site Content editor */
  .site-sec{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:1.3rem;overflow:hidden}
  .site-sec > h2{font-family:'Cormorant Garamond',serif;font-size:1.32rem;color:var(--navy);padding:1.05rem 1.5rem;border-bottom:1px solid var(--hairline);background:#fcfaf6;margin:0}
  .site-sec > h2 small{display:block;font-family:'Inter',sans-serif;font-size:.72rem;font-weight:500;color:var(--muted);text-transform:none;letter-spacing:0;margin-top:.15rem}
  .site-body{display:grid;grid-template-columns:1fr 1fr;gap:1.1rem;padding:1.5rem}
  .site-body .full{grid-column:1/-1}
  .sub-h{grid-column:1/-1;font-size:.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-deep);border-top:1px solid var(--hairline);padding-top:1.1rem;margin-top:.2rem;display:flex;align-items:center;gap:.6rem}
  .lrow{grid-column:1/-1;display:flex;gap:.6rem;align-items:flex-start;background:var(--paper);border:1px solid var(--hairline);border-radius:10px;padding:.75rem}
  .lrow .lfields{flex:1;display:grid;gap:.55rem}
  .lrow .lnum{font-size:.7rem;font-weight:800;color:var(--muted);min-width:1.5rem;padding-top:.55rem}
  .lrow .lacts{display:flex;flex-direction:column;gap:.25rem}
  .mini{border:1px solid var(--hairline);background:#fff;border-radius:7px;width:26px;height:24px;cursor:pointer;font-size:.72rem;line-height:1;color:var(--navy)}
  .mini:hover{border-color:var(--gold);background:#fffdf7}
  .mini.del:hover{border-color:#c66;color:#a33}
  .add-row{grid-column:1/-1;justify-self:start;border:1.5px dashed var(--hairline);background:#fff;border-radius:9px;padding:.5rem 1rem;font:inherit;font-size:.8rem;font-weight:700;color:var(--navy);cursor:pointer}
  .add-row:hover{border-color:var(--gold);color:var(--gold-deep)}
  .site-foot{position:sticky;bottom:0;display:flex;align-items:center;justify-content:flex-end;gap:1rem;padding:1rem 1.5rem;background:rgba(252,250,246,.96);backdrop-filter:blur(8px);border:1px solid var(--hairline);border-radius:var(--r);box-shadow:var(--shadow)}
  .dirty-note{font-size:.8rem;color:var(--gold-deep);font-weight:700}
  @media(max-width:720px){.site-body{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <div style="font-size:2rem">🔐</div>
    <h2>Watson &amp; Watson Associates</h2>
    <p>Content Editor — enter the access code to continue.</p>
    <input type="text" id="code" placeholder="Access code" autocomplete="off">
    <button class="btn btn-navy" style="width:100%;justify-content:center" onclick="login()">Sign In</button>
    <div class="err" id="gate-err"></div>
  </div>
</div>

<div class="topbar">
  <div class="wrap">
    <span><b>Watson &amp; Watson</b> &nbsp;<span class="chip">Content Editor</span></span>
    <span style="display:flex;gap:1.4rem;align-items:center">
      <a href="/" target="_blank">View Site ↗</a>
      <a href="#" onclick="logout();return false">Sign Out</a>
    </span>
  </div>
</div>

<main class="wrap">
  <div class="list-view" id="list-view">
    <div class="head">
      <h1 id="list-title">Speakers</h1>
      <button class="btn btn-navy" id="btn-new" onclick="openEditor()">＋ New Speaker</button>
    </div>
    <div class="tabs">
      <button class="on" id="tab-speakers" onclick="switchTab('speakers')">Speaker's Bureau</button>
      <button id="tab-testimonials" onclick="switchTab('testimonials')">Testimonials</button>
      <button id="tab-site" onclick="switchTab('site')">Site Content</button>
    </div>
    <div class="note" id="list-note">Changes save to <code>data/content.json</code> locally (or Vercel Blob when deployed) and appear on the site immediately.</div>
    <div class="card" id="table-card">
      <table>
        <thead id="thead"></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <!-- Site Content: page copy. Layout, colours and fonts are fixed by design
         and deliberately not editable here. -->
    <div id="site-view" style="display:none">
      <div id="site-sections"></div>
      <div class="site-foot">
        <span id="site-dirty" class="dirty-note"></span>
        <button class="btn btn-gold" onclick="saveSite()">Save &amp; Publish</button>
      </div>
    </div>
  </div>

  <div class="editor" id="editor">
    <div class="head">
      <h1 id="ed-title">New Speaker</h1>
      <button class="btn btn-ghost" onclick="closeEditor()">← Back</button>
    </div>
    <div class="card">
      <form id="form" onsubmit="save(event)">
        <div class="grid" id="fields"></div>
        <div class="form-foot">
          <button type="button" class="btn btn-danger" id="btn-delete" style="display:none" onclick="removeItem()">Delete</button>
          <span style="flex:1"></span>
          <button type="submit" class="btn btn-gold">Save &amp; Publish</button>
        </div>
      </form>
    </div>
  </div>
</main>
<div class="toast" id="toast"></div>

<script>
const CODE_KEY='ww_admin_code';
let doc={speakers:[],testimonials:[]}, tab='speakers', editingIndex=-1, imageData=null;

function hdrs(){return {'Content-Type':'application/json','x-admin-code':sessionStorage.getItem(CODE_KEY)||''}}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)}

function login(){
  const v=document.getElementById('code').value.trim();
  fetch('/api/content',{method:'PUT',headers:{'Content-Type':'application/json','x-admin-code':v},body:'null'})
    .then(async r=>{
      if(r.status===401){document.getElementById('gate-err').textContent='Incorrect code — try again.';return}
      // Any non-401 means the code was accepted. The probe body is deliberately
      // invalid so the API rejects it with 400 without writing anything.
      sessionStorage.setItem(CODE_KEY,v);
      document.getElementById('gate').style.display='none';
      await loadDoc();
    });
}
function logout(){sessionStorage.removeItem(CODE_KEY);location.reload()}
document.getElementById('code').addEventListener('keydown',e=>{if(e.key==='Enter')login()});

async function loadDoc(restore){
  doc=await (await fetch('/api/content')).json();
  if(!Array.isArray(doc.speakers))doc.speakers=[];
  if(!Array.isArray(doc.testimonials))doc.testimonials=[];
  if(restore && !doc.speakers.length && !doc.testimonials.length){
    // login probe may have reset an empty store; nothing to restore
  }
  renderList();
}
async function persist(){
  const r=await fetch('/api/content',{method:'PUT',headers:hdrs(),body:JSON.stringify(doc)});
  return r.ok;
}

function switchTab(t){
  tab=t;editingIndex=-1;
  ['speakers','testimonials','site'].forEach(k=>
    document.getElementById('tab-'+k).classList.toggle('on',t===k));
  const isSite=t==='site';
  document.getElementById('site-view').style.display=isSite?'':'none';
  document.getElementById('table-card').style.display=isSite?'none':'';
  document.getElementById('btn-new').style.display=isSite?'none':'';
  document.getElementById('list-note').innerHTML=isSite
    ? 'Edit the wording on the public page. Layout, colours and fonts are fixed by the design and are not editable here.'
    : 'Changes save to <code>data/content.json</code> locally (or Vercel Blob when deployed) and appear on the site immediately.';
  document.getElementById('list-title').textContent=
    isSite?'Site Content':(t==='speakers'?'Speakers':'Testimonials');
  if(isSite){ if(!siteDoc) loadSite(); else renderSite(); }
  else renderList();
}

/* ── Site Content ─────────────────────────────────────────────────────────
   Schema drives the form, so adding a field here is the only change needed.
   `fields` are single values; `lists` are repeatable rows with add/remove/reorder. */
const SITE_SCHEMA=[
  {key:'topbar',title:'Top Bar',hint:'The thin strip above the navigation',fields:[
    {k:'note',label:'Left-hand note'},{k:'email',label:'Contact email'}]},
  {key:'hero',title:'Hero',hint:'The first screen visitors see',fields:[
    {k:'eyebrow',label:'Tagline above headline'},
    {k:'headline',label:'Headline — first part'},
    {k:'headlineEm',label:'Headline — highlighted words'},
    {k:'lead',label:'Intro paragraph',type:'textarea',full:true},
    {k:'cta1',label:'Button 1 label'},{k:'cta2',label:'Button 2 label'}],
   lists:[{k:'stats',label:'Statistics',cols:[['value','Figure'],['label','Description']]}]},
  {key:'about',title:'About Us',fields:[
    {k:'eyebrow',label:'Section label'},{k:'heading',label:'Heading',full:true},
    {k:'badgeValue',label:'Badge figure'},{k:'badgeLabel',label:'Badge caption'},
    {k:'missionHeading',label:'Mission heading'},{k:'visionHeading',label:'Vision heading'},
    {k:'mission',label:'Mission statement',type:'textarea',full:true},
    {k:'vision',label:'Vision statement',type:'textarea',full:true}],
   lists:[{k:'paragraphs',label:'Body paragraphs',plain:true,type:'textarea'}]},
  {key:'services',title:'Consulting Services',hint:'Numbering is automatic',fields:[
    {k:'eyebrow',label:'Section label'},{k:'heading',label:'Heading'},
    {k:'intro',label:'Intro line',type:'textarea',full:true}],
   lists:[{k:'items',label:'Services',cols:[['title','Title'],['description','Description','textarea']]}]},
  {key:'speakersSection',title:"Speaker's Bureau heading",hint:'Speakers themselves live in the Speaker’s Bureau tab',fields:[
    {k:'eyebrow',label:'Section label'},{k:'heading',label:'Heading'},
    {k:'intro',label:'Intro line',type:'textarea',full:true},
    {k:'ctaLabel',label:'Button label'}]},
  {key:'band',title:'Call-to-action band',fields:[
    {k:'heading',label:'Heading — first part'},
    {k:'headingEm',label:'Heading — highlighted words'},
    {k:'headingAfter',label:'Heading — remainder'},
    {k:'ctaLabel',label:'Button label'},
    {k:'text',label:'Supporting line',type:'textarea',full:true}]},
  {key:'book',title:'Featured Book',fields:[
    {k:'eyebrow',label:'Section label'},{k:'title',label:'Book title'},
    {k:'meta',label:'Publisher / foreword line',full:true},
    {k:'description',label:'Description',type:'textarea',full:true}],
   lists:[{k:'quotes',label:'Endorsements',cols:[['quote','Quote','textarea'],['name','Name'],['affiliation','Affiliation','textarea']]}]},
  {key:'testimonialsSection',title:'Testimonials heading',hint:'The quotes themselves live in the Testimonials tab',fields:[
    {k:'eyebrow',label:'Section label'},{k:'heading',label:'Heading'},
    {k:'intro',label:'Intro line',type:'textarea',full:true}]},
  {key:'contact',title:'Contact',fields:[
    {k:'eyebrow',label:'Section label'},{k:'heading',label:'Heading'},
    {k:'intro',label:'Intro line',type:'textarea',full:true}],
   lists:[
    {k:'items',label:'Contact details',cols:[['label','Label'],['value','Value'],['type','Type: email, phone or location']]},
    {k:'socials',label:'Social links',cols:[['name','Network'],['label','Icon text'],['url','URL']]}]},
  {key:'footer',title:'Footer',fields:[
    {k:'blurb',label:'Footer blurb',type:'textarea',full:true},
    {k:'copyright',label:'Copyright line',full:true}]}
];

let siteDoc=null, siteDirty=false;

async function loadSite(){
  try{ siteDoc=await (await fetch('/api/site')).json(); }
  catch(e){ siteDoc={}; toast('Could not load site content'); }
  siteDirty=false; renderSite();
}

function markDirty(){ siteDirty=true; document.getElementById('site-dirty').textContent='Unsaved changes'; }

function fieldBox(secKey,f,val){
  const id='s_'+secKey+'_'+f.k;
  const input=f.type==='textarea'
    ? `<textarea id="${id}" oninput="onSiteInput('${secKey}','${f.k}',this.value)">${esc(val??'')}</textarea>`
    : `<input type="text" id="${id}" value="${esc(val??'')}" oninput="onSiteInput('${secKey}','${f.k}',this.value)">`;
  return `<div class="${f.full?'full':''}"><label for="${id}">${esc(f.label)}</label>${input}</div>`;
}
function onSiteInput(sec,k,v){ (siteDoc[sec]=siteDoc[sec]||{})[k]=v; markDirty(); }

function listRow(secKey,listKey,cols,plain,type,item,i,total){
  const fields = plain
    ? (type==='textarea'
        ? `<textarea oninput="onListInput('${secKey}','${listKey}',${i},null,this.value)">${esc(item??'')}</textarea>`
        : `<input type="text" value="${esc(item??'')}" oninput="onListInput('${secKey}','${listKey}',${i},null,this.value)">`)
    : cols.map(([ck,clabel,ctype])=>ctype==='textarea'
        ? `<div><label>${esc(clabel)}</label><textarea style="min-height:70px" oninput="onListInput('${secKey}','${listKey}',${i},'${ck}',this.value)">${esc((item&&item[ck])??'')}</textarea></div>`
        : `<div><label>${esc(clabel)}</label><input type="text" value="${esc((item&&item[ck])??'')}" oninput="onListInput('${secKey}','${listKey}',${i},'${ck}',this.value)"></div>`
      ).join('');
  return `<div class="lrow"><div class="lnum">${String(i+1).padStart(2,'0')}</div>
    <div class="lfields">${fields}</div>
    <div class="lacts">
      <button class="mini" title="Move up" ${i===0?'disabled':''} onclick="moveRow('${secKey}','${listKey}',${i},-1)">↑</button>
      <button class="mini" title="Move down" ${i===total-1?'disabled':''} onclick="moveRow('${secKey}','${listKey}',${i},1)">↓</button>
      <button class="mini del" title="Remove" onclick="removeRow('${secKey}','${listKey}',${i})">✕</button>
    </div></div>`;
}
function onListInput(sec,list,i,col,v){
  const arr=siteDoc[sec][list];
  if(col===null) arr[i]=v; else arr[i][col]=v;
  markDirty();
}
function moveRow(sec,list,i,d){
  const a=siteDoc[sec][list], j=i+d;
  if(j<0||j>=a.length) return;
  [a[i],a[j]]=[a[j],a[i]]; markDirty(); renderSite();
}
function removeRow(sec,list,i){
  if(!confirm('Remove this item?')) return;
  siteDoc[sec][list].splice(i,1); markDirty(); renderSite();
}
function addRow(sec,list){
  const spec=SITE_SCHEMA.find(s=>s.key===sec).lists.find(l=>l.k===list);
  const blank=spec.plain?'':Object.fromEntries(spec.cols.map(([k])=>[k,'']));
  (siteDoc[sec][list]=siteDoc[sec][list]||[]).push(blank);
  markDirty(); renderSite();
}

function renderSite(){
  const root=document.getElementById('site-sections');
  root.innerHTML=SITE_SCHEMA.map(sec=>{
    const d=siteDoc[sec.key]||{};
    let body=(sec.fields||[]).map(f=>fieldBox(sec.key,f,d[f.k])).join('');
    (sec.lists||[]).forEach(l=>{
      const arr=Array.isArray(d[l.k])?d[l.k]:[];
      body+=`<div class="sub-h">${esc(l.label)} <span style="color:var(--muted);font-weight:600">(${arr.length})</span></div>`;
      body+=arr.map((it,i)=>listRow(sec.key,l.k,l.cols,l.plain,l.type,it,i,arr.length)).join('');
      body+=`<button class="add-row" onclick="addRow('${sec.key}','${l.k}')">＋ Add ${esc(l.label.replace(/s$/,''))}</button>`;
    });
    return `<div class="site-sec"><h2>${esc(sec.title)}${sec.hint?`<small>${esc(sec.hint)}</small>`:''}</h2>
      <div class="site-body">${body}</div></div>`;
  }).join('');
  document.getElementById('site-dirty').textContent=siteDirty?'Unsaved changes':'';
}

async function saveSite(){
  const r=await fetch('/api/site',{method:'PUT',headers:hdrs(),body:JSON.stringify(siteDoc)});
  if(r.ok){ siteDirty=false; document.getElementById('site-dirty').textContent=''; toast('Site content published'); }
  else toast('Save failed — try signing in again');
}

function renderList(){
  const rows=document.getElementById('rows'), thead=document.getElementById('thead');
  if(tab==='speakers'){
    thead.innerHTML='<tr><th></th><th>Name</th><th class="t-hide">Role</th><th class="t-hide">Topics</th><th style="text-align:right">Actions</th></tr>';
    rows.innerHTML=doc.speakers.map((s,i)=>`
      <tr><td>${s.image?`<img class="thumb" src="${esc(s.image)}">`:'<span class="thumb"></span>'}</td>
      <td class="t-main">${esc(s.name)}</td>
      <td class="t-hide">${esc(s.role||'—')}</td>
      <td class="t-hide">${(s.topics||[]).map(esc).join(', ')}</td>
      <td><div class="actions"><button class="btn btn-ghost btn-sm" onclick="edit(${i})">Edit</button></div></td></tr>`).join('')
      ||'<tr><td colspan="5" style="text-align:center;color:#999;padding:2rem">No speakers yet.</td></tr>';
  } else {
    thead.innerHTML='<tr><th></th><th>Quote</th><th class="t-hide">Attribution</th><th style="text-align:right">Actions</th></tr>';
    rows.innerHTML=doc.testimonials.map((t,i)=>`
      <tr><td>${t.image?`<img class="thumb" src="${esc(t.image)}">`:'<span class="thumb"></span>'}</td>
      <td class="t-main">“${esc((t.quote||'').slice(0,90))}${(t.quote||'').length>90?'…':''}”</td>
      <td class="t-hide">${esc(t.name||'—')}<small style="display:block;color:var(--muted)">${esc(t.title||'')}</small></td>
      <td><div class="actions"><button class="btn btn-ghost btn-sm" onclick="edit(${i})">Edit</button></div></td></tr>`).join('')
      ||'<tr><td colspan="4" style="text-align:center;color:#999;padding:2rem">No testimonials yet.</td></tr>';
  }
}

function fieldHTML(){
  if(tab==='speakers')return `
    <div class="full"><label>Name *</label><input type="text" id="f-name" required></div>
    <div><label>Role / Title</label><input type="text" id="f-role" placeholder="e.g. Founder &amp; Principal"></div>
    <div><label>Topics (comma-separated)</label><input type="text" id="f-topics" placeholder="Leadership, Strategy"></div>
    <div class="full"><label>Biography</label><textarea id="f-bio"></textarea></div>
    <div class="full"><label>Headshot</label>
      <div class="imgdrop" onclick="document.getElementById('f-image').click()">
        <img id="img-preview" style="display:none"><span id="img-hint">Click to upload a photo</span>
      </div>
      <input type="file" id="f-image" accept="image/*" style="display:none" onchange="pickImage(this)">
    </div>`;
  return `
    <div class="full"><label>Quote *</label><textarea id="f-quote" required></textarea></div>
    <div><label>Name</label><input type="text" id="f-name2" placeholder="Client name"></div>
    <div><label>Title / Organization</label><input type="text" id="f-title2" placeholder="e.g. University President"></div>
    <div class="full"><label>Photo (optional)</label>
      <div class="imgdrop" onclick="document.getElementById('f-image').click()">
        <img id="img-preview" style="display:none"><span id="img-hint">Click to upload a photo</span>
      </div>
      <input type="file" id="f-image" accept="image/*" style="display:none" onchange="pickImage(this)">
    </div>`;
}

function openEditor(item,index){
  editingIndex=(index??-1); imageData=item?.image||null;
  document.getElementById('fields').innerHTML=fieldHTML();
  document.getElementById('ed-title').textContent=(item?'Edit ':'New ')+(tab==='speakers'?'Speaker':'Testimonial');
  if(tab==='speakers'){
    document.getElementById('f-name').value=item?.name||'';
    document.getElementById('f-role').value=item?.role||'';
    document.getElementById('f-topics').value=(item?.topics||[]).join(', ');
    document.getElementById('f-bio').value=item?.bio||'';
  }else{
    document.getElementById('f-quote').value=item?.quote||'';
    document.getElementById('f-name2').value=item?.name||'';
    document.getElementById('f-title2').value=item?.title||'';
  }
  if(imageData){const p=document.getElementById('img-preview');p.src=imageData;p.style.display='block';document.getElementById('img-hint').textContent='Click to replace photo'}
  document.getElementById('btn-delete').style.display=item?'inline-flex':'none';
  document.getElementById('list-view').classList.add('closed');
  document.getElementById('editor').classList.add('open');
  window.scrollTo(0,0);
}
function edit(i){openEditor(doc[tab][i],i)}
function closeEditor(){document.getElementById('editor').classList.remove('open');document.getElementById('list-view').classList.remove('closed');renderList()}

function pickImage(inp){
  const f=inp.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{const img=new Image();
    img.onload=()=>{const max=1000,sc=Math.min(1,max/Math.max(img.width,img.height));
      const cv=document.createElement('canvas');cv.width=img.width*sc;cv.height=img.height*sc;
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      imageData=cv.toDataURL('image/jpeg',.85);
      const p=document.getElementById('img-preview');p.src=imageData;p.style.display='block';
      document.getElementById('img-hint').textContent='Click to replace photo';
    };img.src=rd.result;};
  rd.readAsDataURL(f);
}

async function save(e){
  e.preventDefault();
  let item;
  if(tab==='speakers'){
    item={id:slug(document.getElementById('f-name').value),name:document.getElementById('f-name').value.trim(),
      role:document.getElementById('f-role').value.trim(),
      topics:document.getElementById('f-topics').value.split(',').map(s=>s.trim()).filter(Boolean),
      bio:document.getElementById('f-bio').value.trim(),image:imageData};
  }else{
    item={id:slug(document.getElementById('f-name2').value||'testimonial'),quote:document.getElementById('f-quote').value.trim(),
      name:document.getElementById('f-name2').value.trim(),title:document.getElementById('f-title2').value.trim(),image:imageData};
  }
  if(editingIndex>=0)doc[tab][editingIndex]=item;else doc[tab].push(item);
  if(await persist()){toast('Saved ✓');closeEditor()}else toast('Save failed — check access code');
}
function slug(s){return (s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'item')+'-'+Math.random().toString(36).slice(2,6)}
async function removeItem(){
  if(editingIndex<0||!confirm('Delete this entry?'))return;
  doc[tab].splice(editingIndex,1);
  if(await persist()){toast('Deleted');closeEditor()}else toast('Delete failed');
}

if(sessionStorage.getItem(CODE_KEY)){document.getElementById('gate').style.display='none';loadDoc()}
</script>
</body>
</html>
