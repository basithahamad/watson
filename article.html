<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The H.E.L.F Review</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --crimson:#7d1322;--crimson-deep:#560d18;--crimson-ink:#2a060d;
    --gold:#c8a45e;--gold-bright:#dfc084;
    --paper:#f7f4ee;--card:#fff;--ink:#191a1e;--muted:#70747d;--hairline:#e7e2d8;
    --r:16px;--shadow-lg:0 4px 10px rgba(42,6,13,.07),0 30px 70px rgba(42,6,13,.16);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.65;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  img{max-width:100%;display:block}
  .wrap{max-width:1200px;margin:0 auto;padding:0 28px}
  .btn{display:inline-flex;align-items:center;gap:.5rem;padding:.72rem 1.5rem;border-radius:999px;font-weight:700;font-size:.86rem;cursor:pointer;border:none;transition:.22s;font-family:inherit}
  .btn-crimson{background:var(--crimson);color:#fff}
  .btn-crimson:hover{background:var(--crimson-deep)}
  .masthead{background:#fff;padding:1.3rem 0;border-bottom:1px solid var(--hairline)}
  .masthead .wrap{display:flex;align-items:center;justify-content:space-between;gap:1.4rem;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:1rem}
  .brand-logo{width:56px;height:56px;object-fit:contain}
  .brand-name b{display:block;font-family:'DM Serif Display',serif;font-weight:400;font-size:1.7rem;color:var(--crimson-ink);line-height:1.05}
  .brand-name b i{font-style:italic;color:var(--crimson)}
  .brand-name span{font-size:.6rem;letter-spacing:.24em;text-transform:uppercase;color:#9aa0a9;font-weight:700}
  .article-head{max-width:860px;margin:0 auto;padding:3rem 28px 2rem;text-align:center}
  .article-head .cat{font-size:.72rem;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--crimson)}
  .article-head h1{font-family:'DM Serif Display',serif;font-weight:400;font-size:clamp(2.2rem,4.8vw,3.4rem);color:var(--crimson-ink);line-height:1.1;margin:.9rem 0 .8rem}
  .article-head .standfirst{font-size:1.02rem;color:var(--muted);max-width:44rem;margin:0 auto 1.4rem}
  .article-head .meta{font-size:.85rem;color:var(--muted)}
  .article-head .meta b{color:var(--ink)}
  .article-hero{max-width:1000px;margin:0 auto;padding:0 28px}
  .article-hero img{width:100%;max-height:600px;object-fit:cover;border-radius:var(--r);box-shadow:var(--shadow-lg)}
  .article-body{max-width:720px;margin:0 auto;padding:2.6rem 28px 3rem;font-family:'Lora',Georgia,serif;font-size:1.08rem;line-height:1.85;color:#26272c}
  .article-body p{margin-bottom:1.4rem}
  .article-body h2{font-family:'Inter',sans-serif;font-size:.85rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--crimson);margin:2.6rem 0 1.2rem}
  .article-body blockquote{border-top:1px solid var(--gold);border-bottom:1px solid var(--gold);padding:1.7rem 1.2rem;margin:2.2rem 0;text-align:center;font-family:'DM Serif Display',serif;font-style:italic;font-size:1.3rem;line-height:1.45;color:var(--crimson-ink)}
  .back-band{max-width:720px;margin:0 auto 4rem;padding:0 28px;display:flex;gap:1rem}
  footer{background:var(--crimson-ink);color:#bb939b;padding:2.4rem 0;font-size:.82rem}
  footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:1rem}
  footer a:hover{color:var(--gold-bright)}
</style>
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <a class="brand" href="helf-news.html">
      <img class="brand-logo" src="assets/img/helf-logo.png" alt="H.E.L.F. crest">
      <span class="brand-name">
        <b>The H.E.L.F <i>Review</i></b>
        <span>Published by the Higher Education Leadership Foundation</span>
      </span>
    </a>
    <a class="btn btn-crimson" href="helf-news.html#subscribe">Subscribe</a>
  </div>
</header>

<header class="article-head">
  <div class="cat" id="a-cat"></div>
  <h1 id="a-title">Loading…</h1>
  <p class="standfirst" id="a-excerpt"></p>
  <div class="meta" id="a-meta"></div>
</header>

<div class="article-hero" id="a-hero" style="display:none"><img id="a-img" alt=""></div>

<article class="article-body" id="a-body"></article>

<div class="back-band">
  <a class="btn btn-crimson" href="helf-news.html">← Back to The H.E.L.F Review</a>
</div>

<footer>
  <div class="wrap">
    <span>© 2026 Higher Education Leadership Foundation</span>
    <a href="https://heleaders.org/" target="_blank" rel="noopener">H.E.L.F Main Site ↗</a>
  </div>
</footer>

<script>
(async()=>{
  const id=new URLSearchParams(location.search).get('id');
  if(!id){document.getElementById('a-title').textContent='Article not found';return}
  const r=await fetch('/api/articles/'+encodeURIComponent(id));
  if(!r.ok){document.getElementById('a-title').textContent='Article not found';return}
  const a=await r.json();
  document.title=a.title+' — The H.E.L.F Review';
  document.getElementById('a-cat').textContent=a.category||'';
  document.getElementById('a-title').textContent=a.title;
  document.getElementById('a-excerpt').textContent=a.excerpt||'';
  const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  document.getElementById('a-meta').innerHTML='By <b>'+esc(a.author||'Staff')+'</b>'+(a.date?' · '+esc(a.date):'');
  if(a.image){document.getElementById('a-img').src=a.image;document.getElementById('a-hero').style.display='block'}
  // body is editor-authored HTML from the admin (trusted demo content)
  document.getElementById('a-body').innerHTML=a.body||'<p>'+esc(a.excerpt||'')+'</p>';
})();
</script>
</body>
</html>
